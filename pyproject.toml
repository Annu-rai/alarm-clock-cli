[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alarmclock-cli"
version = "0.1.1"
description = "A dependency-free command-line alarm clock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["alarm", "clock", "timer", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Annu-rai/alarm-clock-cli"
Repository = "https://github.com/Annu-rai/alarm-clock-cli"
Issues = "https://github.com/Annu-rai/alarm-clock-cli/issues"
Changelog = "https://github.com/Annu-rai/alarm-clock-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alarm = "alarmclock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alarmclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
