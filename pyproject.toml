[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alarmclock-cli"
version = "0.1.0"
description = "A dependency-free command-line alarm clock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["alarm", "clock", "timer", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alarm = "alarmclock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alarmclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
